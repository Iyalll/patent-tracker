name: Supabase keepalive

# 免费版 Supabase 长期无访问会暂停，这里每 3 天访问一次。
# 需要在仓库 Settings → Secrets and variables → Actions 中添加 SUPABASE_URL 和 SUPABASE_KEY。
on:
  schedule:
    - cron: '17 3 */3 * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ]; then echo "未配置 SUPABASE_URL，跳过"; exit 0; fi
          curl -fsS "$SUPABASE_URL/rest/v1/profiles?select=id&limit=1" \
            -H "apikey: $SUPABASE_KEY" -o /dev/null -w "HTTP %{http_code}\n"
